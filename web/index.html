<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DayZ Atlas</title>
    <script>
      try {
        const t = localStorage.getItem("atlas:theme");
        if (t) document.documentElement.dataset.theme = t;
        const p = localStorage.getItem("atlas:palette");
        if (p) document.documentElement.dataset.palette = p;
      } catch {}
    </script>
    <!-- Boot screen: same colour and mark as the installed app's splash, so the hand-off from
         Android's static splash is seamless. src/lib/boot.ts fades it out once the map is ready. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #2b3024;
        transition: opacity 0.45s ease 0.1s;
      }
      #boot svg {
        width: 96px;
        height: 96px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot.boot--done {
        opacity: 0;
        pointer-events: none;
      }
      #boot.boot--done svg {
        animation: none;
        transform: scale(1.5);
        opacity: 0;
        transition:
          transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1),
          opacity 0.4s ease;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.06);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg,
        #boot.boot--done svg {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="9" fill="none" stroke="#ff7b1c" stroke-width="2.5" />
        <path d="M16 4v6M16 22v6M4 16h6M22 16h6" stroke="#ff7b1c" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
